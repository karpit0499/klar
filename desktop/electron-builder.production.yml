extends: desktop/electron-builder.yml
productName: Klar
artifactName: Klar-${version}-${os}-${arch}.${ext}

# A real Developer ID signature replaces the ad-hoc preview signature, so the
# preview-only fuse must never be inherited by a hardened production build.
electronFuses:
  resetAdHocDarwinSignature: false

mac:
  category: public.app-category.productivity
  identity: "${env.CSC_NAME}"
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: desktop/entitlements.mac.plist
  entitlementsInherit: desktop/entitlements.mac.plist
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64

win:
  target:
    - target: nsis
      arch:
        - x64
  verifyUpdateCodeSignature: true
  # Without its own name the installer would resolve to the same top-level
  # artifact path as the preview portable build and overwrite it.
  nsis:
    artifactName: Klar-Setup-${version}-${os}-${arch}.${ext}

publish:
  provider: github
  owner: karpit0499
  repo: klar
  releaseType: draft

name = "klar-proxy"
main = "src/index.ts"
compatibility_date = "2025-01-01"
# Groq's public API is also served through Cloudflare. Without this flag,
# Worker-to-Worker fetches can fail before Groq receives the request.
compatibility_flags = ["global_fetch_strictly_public"]

# Optional: restrict which origins may use your proxy (recommended once your
# GitHub Pages URL is known). Leave unset to allow all origins ("*").
[vars]
ALLOWED_ORIGINS = "https://karpit0499.github.io"

# Adzuna keys are SECRETS — never put them here. Set them with:
#   npx wrangler secret put ADZUNA_APP_ID
#   npx wrangler secret put ADZUNA_APP_KEY

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f7f5ef" />
    <title>Page not found · Seite nicht gefunden · Klar</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f5ef;
        color: #17191d;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
      main { width: min(100%, 680px); border: 1px solid #c9c8c2; border-radius: 18px; background: #fff; padding: clamp(24px, 7vw, 56px); }
      .brand { margin: 0 0 40px; font-size: 1.25rem; font-weight: 800; letter-spacing: -0.04em; }
      .brand span { color: #175cff; }
      h1 { margin: 0; max-width: 14ch; font-size: clamp(2rem, 8vw, 4.5rem); line-height: 0.98; letter-spacing: -0.055em; }
      p { margin: 20px 0 0; max-width: 52ch; color: #555960; font-size: 1.05rem; line-height: 1.6; }
      nav { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
      a { display: inline-flex; min-height: 44px; align-items: center; justify-content: center; border: 1px solid #b6b7bc; border-radius: 10px; padding: 10px 16px; color: inherit; font-weight: 700; text-decoration: none; }
      a:first-child { border-color: #175cff; background: #175cff; color: #fff; }
      a:focus-visible { outline: 3px solid #ffbf47; outline-offset: 3px; }
      @media (prefers-color-scheme: dark) {
        :root { background: #111317; color: #f3f4f6; }
        main { border-color: #393d45; background: #1a1d23; }
        p { color: #b7bbc3; }
        a { border-color: #5b606a; }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand" aria-label="Klar">Klar<span>.</span></p>
      <h1>Page not found.</h1>
      <p>
        The address may have moved. Die Adresse wurde möglicherweise geändert.
        Open Klar or use the governed Knowledge Base index to continue.
      </p>
      <nav aria-label="Recovery links">
        <a href="/klar/">Open Klar</a>
        <a href="/klar/kb/docs/">Knowledge Base</a>
      </nav>
    </main>
  </body>
</html>

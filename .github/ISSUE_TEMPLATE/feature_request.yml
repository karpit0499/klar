name: Feature request
description: Suggest a public product improvement without including personal documents.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Feature requests are public. Describe the need without attaching or
        pasting a real résumé, application, private job description, or secret.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not include personal documents, secrets, or employer-private information.
          required: true

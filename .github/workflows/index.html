<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <!-- Brand theme-color, one per scheme so the mobile browser chrome matches. -->
    <meta name="theme-color" content="#f5f5f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)" />
    <!--
      Browser icons use explicit appearance-specific files. Installed-app
      surfaces get a fixed dark-safe asset because operating systems may apply
      their own icon treatment without evaluating SVG media queries.
    -->
    <link rel="icon" href="%BASE_URL%icon.svg" type="image/svg+xml" />
    <link rel="icon" href="%BASE_URL%icon-light.svg" type="image/svg+xml" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="%BASE_URL%icon-dark.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" sizes="180x180" />
    <title>Klar — Job Tracker</title>
    <!--
      Apply the saved theme BEFORE first paint to avoid a flash of the wrong
      scheme (FOUC). This synchronous external script runs before the app
      bundle and remains compatible with the desktop Content Security Policy.
      It mirrors resolveTheme() in src/ui/theme.ts.
    -->
    <script vite-ignore src="%BASE_URL%theme-bootstrap.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

# Verifies every pull request, then deploys the exact verified build from main.
name: Verify and deploy Klar

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            knowledge-base/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm ci
        working-directory: knowledge-base
      - run: python -m pip install --require-hashes -r knowledge-base/requirements-pdf.txt
      - run: node --check public/sw.js
      - run: node --check public/theme-bootstrap.js
      - run: node model/experiments/build-kaggle-notebook.mjs --check
      - run: npm run qa
        env:
          VITE_WORKER_URL: ${{ vars.VITE_WORKER_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
      - run: npm run audit:production
      - run: npm run audit:build-tools
      - run: npm run build
        env:
          VITE_WORKER_URL: ${{ vars.VITE_WORKER_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
      - run: npm run bundle:check
      - run: npm run pdf:repro
        working-directory: knowledge-base
      - run: npm run pdf:verify
        working-directory: knowledge-base
      - run: npm run qa
        working-directory: knowledge-base
        env:
          NEXT_PUBLIC_KB_BASE_PATH: /klar/kb
          NEXT_PUBLIC_KB_SITE_URL: https://karpit0499.github.io/klar/kb
      - name: Assemble one GitHub Pages artifact
        run: |
          mkdir -p dist/kb
          cp -R knowledge-base/out/. dist/kb/
          touch dist/.nojekyll
          if grep -R "chatgpt.site" dist/kb; then exit 1; fi
      - uses: actions/configure-pages@v5
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

# Verifies every pull request, then deploys the exact verified build from main.
name: Verify and deploy Klar

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --check public/sw.js
      - run: npm run typecheck
      - run: npm run worker:types:check
      - run: npm run worker:check
      - run: npm test
      # Bake your Worker URL into the build (set it as a repo variable or secret).
      - run: npm run build
        env:
          VITE_WORKER_URL: ${{ vars.VITE_WORKER_URL }}
      - run: npm run worker:dry-run
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
